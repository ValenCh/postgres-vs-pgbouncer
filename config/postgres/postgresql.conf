# Parámetros del paper (Sección 3.2). El resto son valores por defecto salvo que se indique.
listen_addresses = '*'
unix_socket_directories = '/var/run/postgresql'
max_connections = 100                 # defecto de PostgreSQL; en A quedan 97 ranuras útiles
superuser_reserved_connections = 3    # defecto de PostgreSQL
shared_buffers = 1024MB
work_mem = 4MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9
password_encryption = scram-sha-256
log_min_messages = warning
log_connections = off                 # evita sesgar la medición con logging por conexión
log_disconnections = off
# NOTA: idle_in_transaction_session_timeout queda en 0 (desactivado) por defecto.
# El escenario D2 lo activa por rol (ALTER ROLE) desde src/ejecutar_experimentos.py.
