name: pruebas-resiliencia-pg

services:
  postgres:
    image: postgres:16.4
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-bench}
      APP_CORE_PASSWORD: ${APP_CORE_PASSWORD:?Falta APP_CORE_PASSWORD en .env}
      APP_PORTAL_PASSWORD: ${APP_PORTAL_PASSWORD:?Falta APP_PORTAL_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./scripts/sonda_recursos.sh:/sonda/sonda_recursos.sh:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"   # solo loopback: nunca expuesto a la red
    cpus: ${PG_CPUS:-4}
    cpuset: ${PG_CPUSET:-0-3}
    mem_limit: ${PG_MEM:-4g}
    memswap_limit: ${PG_MEM:-4g}                 # sin swap, como un límite duro de RAM
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
    image: pruebas-resiliencia/pgbouncer:1.22
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./runtime/pgbouncer:/etc/pgbouncer:ro     # generado por src/configuracion.py
      - ./scripts/sonda_recursos.sh:/sonda/sonda_recursos.sh:ro
    ports:
      - "127.0.0.1:${PGB_HOST_PORT:-6432}:6432"
    cpus: ${PGB_CPUS:-1}
    cpuset: ${PGB_CPUSET:-4}
    mem_limit: ${PGB_MEM:-512m}
    memswap_limit: ${PGB_MEM:-512m}
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6432'"]
      interval: 3s
      timeout: 3s
      retries: 20

  loadgen:
    build:
      context: .
      dockerfile: Dockerfile.loadgen
    image: pruebas-resiliencia/loadgen:1
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      APP_CORE_PASSWORD: ${APP_CORE_PASSWORD}
      APP_PORTAL_PASSWORD: ${APP_PORTAL_PASSWORD}
      PYTHONUNBUFFERED: "1"
    cpus: ${LG_CPUS:-4}
    cpuset: ${LG_CPUSET:-5-8}
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"   # reconexiones masivas (30 % efímeros)
      net.ipv4.tcp_tw_reuse: "1"

volumes:
  pgdata:
